name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        python -m pytest test_app.py

    - name: Build Docker Image Locally
      run: |
        docker build -t local-banking-app:${{ github.sha }} .

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config

    - name: Update Image Tag and Deploy
      run: |
        sed -i 's|DOCKERHUB_USERNAME/banking-app:TAG_PLACEHOLDER|local-banking-app:${{ github.sha }}|g' deployment.yaml
        kubectl apply -f deployment.yaml
