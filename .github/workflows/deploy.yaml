name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Automated Tests
      run: pytest test_app.py
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/banking-app:${{ github.sha }}
    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config
    - name: Update Image Tag and Deploy
      run: |
        sed -i 's|DOCKERHUB_USERNAME/banking-app:TAG_PLACEHOLDER|${{ secrets.DOCKERHUB_USERNAME }}/banking-app:${{ github.sha }}|g' deployment.yaml
        kubectl apply -f deployment.yaml
